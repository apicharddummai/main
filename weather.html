<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Ubon Weather Realtime 1669</title>
  <link href="https://fonts.googleapis.com/css2?family=Kanit:wght@400;600&display=swap" rel="stylesheet">
  <style>
    /* ตั้งค่าหน้าจอให้พอดีกับ Widget บนทีวี */
    body { 
      margin: 0; 
      background: transparent; 
      font-family: 'Kanit', sans-serif; 
      display: flex; 
      align-items: center; 
      justify-content: center; 
      height: 100vh; 
      overflow: hidden; 
    }
    
    .weather-card {
      display: flex;
      align-items: center;
      gap: 20px;
      padding: 15px 25px;
      border-radius: 20px;
      /* สีแดงกู้ชีพ-ส้มไล่เฉด สังเกตง่าย */
      background: linear-gradient(135deg, #e74c3c, #c0392b);
      color: #ffffff;
      box-shadow: 0 8px 20px rgba(0, 0, 0, 0.4);
      min-width: 250px;
      border: 2px solid rgba(255, 255, 255, 0.2);
    }

    /* ไอคอนก้อนเมฆขนาดใหญ่ขึ้นเพื่อความชัดเจน */
    .icon-box {
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .icon-svg { 
      width: 60px; 
      height: 60px; 
      fill: white; 
      filter: drop-shadow(0 2px 4px rgba(0,0,0,0.3));
    }

    .text-content { 
      display: flex; 
      flex-direction: column; 
      line-height: 1.1; 
    }
    
    .location { 
      font-size: 18px; 
      font-weight: 600; 
      letter-spacing: 0.5px;
    }
    
    .temp-display { 
      font-size: 42px; 
      font-weight: 600; 
      margin: 2px 0;
    }
    
    .status-bar { 
      font-size: 12px; 
      opacity: 0.85; 
      margin-top: 4px;
      background: rgba(0,0,0,0.15);
      padding: 2px 8px;
      border-radius: 10px;
      width: fit-content;
    }
  </style>
</head>
<body>

  <div class="weather-card">
    <div class="icon-box">
      <svg class="icon-svg" viewBox="0 0 24 24">
        <path d="M19.35 10.04C18.67 6.59 15.64 4 12 4 9.11 4 6.6 5.64 5.35 8.04 2.34 8.36 0 10.91 0 14c0 3.31 2.69 6 6 6h13c2.76 0 5-2.24 5-5 0-2.64-2.05-4.78-4.65-4.96z"/>
      </svg>
    </div>
    
    <div class="text-content">
      <div class="location">อุบลราชธานี</div>
      <div class="temp-display" id="temp">--°C</div>
      <div class="status-bar" id="status">กำลังโหลด...</div>
    </div>
  </div>

  <script>
    function fetchWeather() {
      // พิกัด อ.เมืองอุบลฯ
      var apiURL = 'https://api.open-meteo.com/v1/forecast?latitude=15.2287&longitude=104.8587&current_weather=true';
      
      var xhr = new XMLHttpRequest();
      xhr.open('GET', apiURL, true);
      
      // ตั้งค่า Timeout 15 วินาที สำหรับกล่องทีวีที่ต่อ Wi-Fi ไกลๆ
      xhr.timeout = 15000;

      xhr.onreadystatechange = function () {
        if (xhr.readyState === 4) {
          if (xhr.status === 200) {
            try {
              var response = JSON.parse(xhr.responseText);
              var currentTemp = Math.round(response.current_weather.temperature);
              
              // แสดงผลอุณหภูมิ
              document.getElementById('temp').innerHTML = currentTemp + '°C';
              
              // จัดรูปแบบเวลาแบบ Manual (รองรับ TV ทุกรุ่น)
              var d = new Date();
              var hh = d.getHours();
              var mm = d.getMinutes();
              var timeStr = (hh < 10 ? '0' + hh : hh) + ':' + (mm < 10 ? '0' + mm : mm);
              
              document.getElementById('status').innerHTML = 'อัปเดตล่าสุด ' + timeStr + ' น.';
            } catch (e) {
              document.getElementById('status').innerHTML = 'ข้อมูลผิดพลาด';
            }
          } else {
            document.getElementById('status').innerHTML = 'ขาดการเชื่อมต่อ';
          }
        }
      };

      xhr.ontimeout = function () {
        document.getElementById('status').innerHTML = 'เชื่อมต่อช้าเกินไป';
      };

      xhr.onerror = function () {
        document.getElementById('status').innerHTML = 'เครือข่ายมีปัญหา';
      };

      xhr.send();
    }

    // เริ่มทำงานทันที
    fetchWeather();

    // ตั้งเวลาอัปเดตอัตโนมัติทุก 10 นาที (600,000 ms)
    // การตั้งเวลาที่เหมาะสมช่วยลดภาระ CPU ของกล่อง TV
    setInterval(fetchWeather, 600000);
  </script>

</body>
</html>
