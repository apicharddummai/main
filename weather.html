<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8">
  <title>Ubon Weather Realtime 1669</title>
  <link href="https://fonts.googleapis.com/css2?family=Kanit:wght@400;600&display=swap" rel="stylesheet">
  <style>
    body { margin: 0; background: transparent; font-family: 'Kanit', sans-serif; display: flex; align-items: center; justify-content: center; height: 100vh; overflow: hidden; }
    
    .weather-card {
      display: flex;
      align-items: center;
      gap: 20px;
      padding: 15px 25px;
      border-radius: 20px;
      background: linear-gradient(135deg, #e74c3c, #c0392b);
      color: #ffffff;
      box-shadow: 0 8px 20px rgba(0, 0, 0, 0.4);
      min-width: 250px;
    }

    .icon-box { display: flex; align-items: center; justify-content: center; }
    .icon-svg { 
        width: 65px; height: 65px; fill: white; 
        filter: drop-shadow(0 2px 4px rgba(0,0,0,0.3)); 
    }

    .text-content { display: flex; flex-direction: column; line-height: 1.1; }
    .location { font-size: 18px; font-weight: 600; }
    .temp-display { font-size: 42px; font-weight: 600; margin: 2px 0; }
    .status-bar { font-size: 12px; opacity: 0.85; margin-top: 4px; background: rgba(0,0,0,0.15); padding: 2px 8px; border-radius: 10px; width: fit-content; }
  </style>
</head>
<body>

  <div class="weather-card">
    <div class="icon-box" id="weather-icon">
      <svg class="icon-svg" viewBox="0 0 24 24"><path d="M19.35 10.04C18.67 6.59 15.64 4 12 4 9.11 4 6.6 5.64 5.35 8.04 2.34 8.36 0 10.91 0 14c0 3.31 2.69 6 6 6h13c2.76 0 5-2.24 5-5 0-2.64-2.05-4.78-4.65-4.96z"/></svg>
    </div>
    
    <div class="text-content">
      <div class="location">อุบลราชธานี</div>
      <div class="temp-display" id="temp">--°C</div>
      <div class="status-bar" id="status">กำลังโหลด...</div>
    </div>
  </div>

  <script>
    // ฟังก์ชันเลือกไอคอนตาม Weather Code
    function getIcon(code) {
      var sun = '<path d="M12 7c-2.76 0-5 2.24-5 5s2.24 5 5 5 5-2.24 5-5-2.24-5-5-5zM2 13h2c.55 0 1-.45 1-1s-.45-1-1-1H2c-.55 0-1 .45-1 1s.45 1 1 1zm18 0h2c.55 0 1-.45 1-1s-.45-1-1-1h-2c-.55 0-1 .45-1 1s.45 1 1 1zM11 2v2c0 .55.45 1 1 1s1-.45 1-1V2c0-.55-.45-1-1-1s-1 .45-1 1zm0 18v2c0 .55.45 1 1 1s1-.45 1-1v-2c0-.55-.45-1-1-1s-1 .45-1 1zM5.99 4.58a.996.996 0 00-1.41 0 .996.996 0 000 1.41l1.06 1.06c.39.39 1.03.39 1.41 0s.39-1.03 0-1.41L5.99 4.58zm12.37 12.37a.996.996 0 00-1.41 0 .996.996 0 000 1.41l1.06 1.06c.39.39 1.03.39 1.41 0a.996.996 0 000-1.41l-1.06-1.06zm1.06-10.96a.996.996 0 000-1.41.996.996 0 00-1.41 0l-1.06 1.06c-.39.39-.39 1.03 0 1.41s1.03.39 1.41 0l1.06-1.06zM7.05 18.36a.996.996 0 000-1.41.996.996 0 00-1.41 0l-1.06 1.06c-.39.39-.39 1.03 0 1.41s1.03.39 1.41 0l1.06-1.06z"/>';
      var cloud = '<path d="M19.35 10.04C18.67 6.59 15.64 4 12 4 9.11 4 6.6 5.64 5.35 8.04 2.34 8.36 0 10.91 0 14c0 3.31 2.69 6 6 6h13c2.76 0 5-2.24 5-5 0-2.64-2.05-4.78-4.65-4.96z"/>';
      var rain = '<path d="M12 2c-4.97 0-9 4.03-9 9 0 3.58 2.09 6.67 5.14 8.13.19.09.32.28.32.49 0 .28-.22.51-.5.51h-.1c-.39 0-.74-.23-.88-.59C3.96 17.16 2 14.31 2 11c0-5.52 4.48-10 10-10s10 4.48 10 10c0 3.31-1.96 6.16-4.98 8.54-.14.36-.49.59-.88.59h-.1c-.28 0-.5-.23-.5-.51 0-.21.13-.4.32-.49C18.91 17.67 21 14.58 21 11c0-4.97-4.03-9-9-9z"/><path d="M7 16l-.5 2.5m4-2.5l-.5 5m4.5-5l-.5 2.5"/>';
      var storm = '<path d="M18 10h-1.26A8 8 0 109 15h9a5 5 0 000-10zM9 13a4 4 0 111.41-7.73 4 4 0 01-1.41 7.73zm4 5l-2 3h4l-2 3"/>';

      // เช็คค่าจาก Open-Meteo
      if (code == 0) return sun; // ท้องฟ้าแจ่มใส
      if (code >= 1 && code <= 3) return cloud; // มีเมฆบางส่วน
      if (code >= 51 && code <= 67) return rain; // ฝนตก
      if (code >= 80 && code <= 82) return rain; // ฝนไล่ช้าง
      if (code >= 95) return storm; // พายุฝนฟ้าคะนอง
      return cloud; // ค่าพื้นฐาน
    }

    function fetchWeather() {
      var apiURL = 'https://api.open-meteo.com/v1/forecast?latitude=15.2287&longitude=104.8587&current_weather=true';
      var xhr = new XMLHttpRequest();
      xhr.open('GET', apiURL, true);
      xhr.onreadystatechange = function () {
        if (xhr.readyState === 4 && xhr.status === 200) {
            var response = JSON.parse(xhr.responseText);
            var current = response.current_weather;
            
            // อัปเดตอุณหภูมิ
            document.getElementById('temp').innerHTML = Math.round(current.temperature) + '°C';
            
            // อัปเดตไอคอนตาม weathercode
            var iconPath = getIcon(current.weathercode);
            document.getElementById('weather-icon').innerHTML = '<svg class="icon-svg" viewBox="0 0 24 24">' + iconPath + '</svg>';
            
            // อัปเดตเวลา
            var d = new Date();
            var timeStr = (d.getHours() < 10 ? '0' : '') + d.getHours() + ':' + (d.getMinutes() < 10 ? '0' : '') + d.getMinutes();
            document.getElementById('status').innerHTML = 'อัปเดตล่าสุด ' + timeStr + ' น.';
        }
      };
      xhr.send();
    }

    fetchWeather();
    setInterval(fetchWeather, 600000); // 10 นาที
  </script>
</body>
</html>
