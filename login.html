<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>EMS 1669 SYSTEM</title>
    <link href="https://fonts.googleapis.com/css2?family=Kanit:wght@300;500;600&display=swap" rel="stylesheet">
    <style>
        /* สไตล์เดิมของคุณ (คงไว้เพื่อความสวยงาม) */
        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Kanit', sans-serif; }
        body { height: 100vh; display: flex; justify-content: center; align-items: center; background: #0f172a; color: white; overflow: hidden; }
        .bg-glow { position: absolute; width: 500px; height: 500px; background: radial-gradient(circle, rgba(239,68,68,0.15) 0%, rgba(15,23,42,0) 70%); border-radius: 50%; z-index: -1; filter: blur(60px); }
        .card { background: rgba(255, 255, 255, 0.03); backdrop-filter: blur(20px); border: 1px solid rgba(255, 255, 255, 0.1); padding: 30px; border-radius: 28px; width: 100%; max-width: 450px; box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.5); text-align: center; }
        h2 { font-size: 22px; font-weight: 600; margin-bottom: 5px; color: #ef4444; }
        .subtitle { color: #94a3b8; font-size: 13px; margin-bottom: 25px; }
        .form-group { text-align: left; margin-bottom: 15px; }
        label { font-size: 11px; color: #94a3b8; text-transform: uppercase; margin-left: 5px; }
        input { width: 100%; padding: 12px 15px; margin-top: 5px; background: rgba(255, 255, 255, 0.05); border: 1px solid rgba(255, 255, 255, 0.1); border-radius: 10px; color: white; font-size: 15px; }
        button { width: 100%; padding: 12px; background: #ef4444; color: white; border: none; border-radius: 10px; font-size: 16px; font-weight: 600; cursor: pointer; margin-top: 5px; transition: 0.3s; }
        button:hover { background: #dc2626; transform: translateY(-1px); }
        .user-list-container { max-height: 180px; overflow-y: auto; margin-top: 15px; background: rgba(0,0,0,0.2); border-radius: 10px; text-align: left; }
        table { width: 100%; border-collapse: collapse; font-size: 13px; }
        th, td { padding: 10px; border-bottom: 1px solid rgba(255,255,255,0.05); }
        .del-btn { color: #ff4d4d; cursor: pointer; text-decoration: underline; }
        .hidden { display: none; }
        .admin-btn { background: transparent; border: 1px solid #475569; color: #475569; margin-top: 15px; font-size: 12px; padding: 8px; }
    </style>
</head>
<body>

    <div class="bg-glow"></div>

    <div class="card" id="loginPage">
        <h2>CENTRAL EMS 1669</h2>
        <p class="subtitle">ระบบจัดการเจ้าหน้าที่หลายคน</p>
        
        <div class="form-group">
            <label>Username</label>
            <input type="text" id="userInput" placeholder="ชื่อผู้ใช้งาน">
        </div>
        <div class="form-group">
            <label>Password</label>
            <input type="password" id="passInput" placeholder="รหัสผ่าน">
        </div>
        
        <button onclick="handleLogin()">เข้าสู่ระบบ</button>
       
    </div>

    <div class="card hidden" id="adminPage">
        <h2>จัดการเจ้าหน้าที่</h2>
        <p class="subtitle">เพิ่ม/ลบ แอดมินและผู้ใช้งาน</p>
        
        <div style="display: flex; gap: 10px; margin-bottom: 15px;">
            <input type="text" id="newU" placeholder="User" style="margin:0">
            <input type="text" id="newP" placeholder="Pass" style="margin:0">
        </div>
        <button onclick="addUser()" style="background: #22c55e;">+ เพิ่มรายชื่อใหม่</button>

        <div class="user-list-container">
            <table>
                <thead>
                    <tr><th>User</th><th>Pass</th><th>ลบ</th></tr>
                </thead>
                <tbody id="userListBody"></tbody>
            </table>
        </div>

        <button onclick="location.reload()" style="background: transparent; border: 1px solid #475569; margin-top: 15px;">กลับหน้าล็อคอิน</button>
    </div>

    <script>
        const REDIRECT_URL = "https://www.google.com";
        
        // ข้อมูลเริ่มต้น (ตัวแรกจะเป็น Master Admin เสมอ)
       const initialUsers = [
    { user: "admin", pass: "1669" },
    { user: "kik", pass: "1669" },
    { user: "ems_staff", pass: "8888" },
    { user: "หัวหน้า", pass: "5555" }
];


        function getUsers() {
            const data = localStorage.getItem('ems_multi_users');
            return data ? JSON.parse(data) : initialUsers;
        }

        function saveUsers(users) {
            localStorage.setItem('ems_multi_users', JSON.stringify(users));
            renderUserList();
        }

        function handleLogin() {
    const u = document.getElementById('userInput').value;
    const p = document.getElementById('passInput').value;
    const users = getUsers(); // ฟังก์ชันดึงรายชื่อจากคราวก่อน
    const found = users.find(acc => acc.user === u && acc.pass === p);

    if (found) {
        // --- ส่วนสำคัญ: สร้างกุญแจเก็บไว้ใน Browser ---
        localStorage.setItem('ems_ubon_auth', 'authorized_secure_1669');
        
        // เข้าสู่หน้าหลัก
        window.location.href = "main.html"; 
    } else {
        alert("ข้อมูลไม่ถูกต้อง!");
    }
}
        function openAdmin() {
            const u = document.getElementById('userInput').value;
            const p = document.getElementById('passInput').value;
            const users = getUsers();
            
            // เช็คว่า User/Pass ที่กรอกอยู่ในระบบไหม
            const found = users.find(acc => acc.user === u && acc.pass === p);

            if (found) {
                document.getElementById('loginPage').classList.add('hidden');
                document.getElementById('adminPage').classList.remove('hidden');
                renderUserList();
            } else {
                alert("กรุณากรอก Username และ Password ที่ถูกต้องก่อนจัดการระบบ");
            }
        }

        function renderUserList() {
            const users = getUsers();
            const tbody = document.getElementById('userListBody');
            tbody.innerHTML = '';
            users.forEach((item, index) => {
                tbody.innerHTML += `<tr>
                    <td>${item.user}</td>
                    <td>${item.pass}</td>
                    <td>${index === 0 ? '-' : `<span class="del-btn" onclick="deleteUser(${index})">ลบ</span>`}</td>
                </tr>`;
            });
        }

        function addUser() {
            const u = document.getElementById('newU').value;
            const p = document.getElementById('newP').value;
            if (!u || !p) return alert("กรุณากรอกให้ครบ");
            const users = getUsers();
            users.push({ user: u, pass: p });
            saveUsers(users);
            document.getElementById('newU').value = '';
            document.getElementById('newP').value = '';
        }

        function deleteUser(index) {
            if (confirm("ลบรายชื่อนี้?")) {
                const users = getUsers();
                users.splice(index, 1);
                saveUsers(users);
            }
        }
		
		
		
		
		
    </script>
	
	<script>
    // 1. ป้องกันการคลิกขวา (Disable Right Click)
    document.addEventListener('contextmenu', function(e) {
        e.preventDefault();
       
    });

    // 2. ป้องกันปุ่มลัดต่างๆ (Disable Shortcuts)
    document.onkeydown = function(e) {
        // ป้องกัน F12 (Inspect Element)
        if (e.keyCode == 123) {
            return false;
        }
        // ป้องกัน Ctrl+Shift+I (Inspect)
        if (e.ctrlKey && e.shiftKey && e.keyCode == 'I'.charCodeAt(0)) {
            return false;
        }
        // ป้องกัน Ctrl+Shift+C (Inspect Element)
        if (e.ctrlKey && e.shiftKey && e.keyCode == 'C'.charCodeAt(0)) {
            return false;
        }
        // ป้องกัน Ctrl+Shift+J (Console)
        if (e.ctrlKey && e.shiftKey && e.keyCode == 'J'.charCodeAt(0)) {
            return false;
        }
        // ป้องกัน Ctrl+U (View Source)
        if (e.ctrlKey && e.keyCode == 'U'.charCodeAt(0)) {
            return false;
        }
        // ป้องกัน Ctrl+S (Save Page)
        if (e.ctrlKey && e.keyCode == 'S'.charCodeAt(0)) {
            return false;
        }
    };
</script>
</body>
</html>
