<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8">
  <link href="https://fonts.googleapis.com/css2?family=Sarabun&display=swap" rel="stylesheet">
  <style>
    body { font-family: 'Sarabun', sans-serif; background: #f4f7f6; padding: 20px; user-select: none; }
    .container { max-width: 1100px; margin: auto; background: white; padding: 30px; border-radius: 15px; box-shadow: 0 4px 15px rgba(0,0,0,0.1); }
    h2 { text-align: center; color: #333; margin-bottom: 25px; }
    table { width: 100%; border-collapse: collapse; margin-top: 10px; }
    th { background: #007bff; color: white; padding: 12px; font-size: 14px; }
    td { border-bottom: 1px solid #eee; padding: 12px; text-align: center; font-size: 14px; }
    .name-col { text-align: left; padding-left: 10px; }
    .type-col { text-align: center; font-size: 13px; color: #555; }
  </style>
</head>
<body oncontextmenu="return false;"> <div class="container">
  <h2>📋 ตรวจสอบสถานะใบอนุญาต / ใบประกาศ</h2>
  <table id="myTable">
    <thead>
      <tr>
        <th>ลำดับ</th>
        <th>ชื่อ-นามสกุล</th>
        <th>ประเภทใบอนุญาต</th>
        <th>วันออกฯ</th>
        <th>วันหมดอายุ</th>
        <th>คงเหลือ</th>
        <th>สถานะ</th>
      </tr>
    </thead>
    <tbody><tr><td colspan="7">กำลังโหลดข้อมูล...</td></tr></tbody>
  </table>
</div>

<script>
  // ล็อกปุ่มลัด (F12, Ctrl+Shift+I, Ctrl+U, Ctrl+S, Ctrl+A)
  document.addEventListener('keydown', function(event) {
    if (event.keyCode === 123 || 
       (event.ctrlKey && event.shiftKey && event.keyCode === 73) || 
       (event.ctrlKey && event.keyCode === 85) || 
       (event.ctrlKey && event.keyCode === 83) || 
       (event.ctrlKey && event.keyCode === 65)) {
        event.preventDefault(); 
        return false;
    }
  });

  const SHEET_ID = "1jyk7Yr7y0tFkTGc5vHrntkRxMZX6U-HmDptZPbjGD3o";
  const url = `https://docs.google.com/spreadsheets/d/${SHEET_ID}/gviz/tq?tqx=out:json&gid=0`;

  fetch(url)
    .then(res => res.text())
    .then(text => {
      const json = JSON.parse(text.substring(47).slice(0, -2));
      const tbody = document.querySelector('#myTable tbody');
      tbody.innerHTML = "";
      
      json.table.rows.forEach((row) => {
        if (!row.c[1]) return;
        tbody.innerHTML += `<tr>
          <td>${row.c[0]?.v || '-'}</td>
          <td class="name-col">${row.c[1]?.f || row.c[1]?.v || '-'}</td>
          <td class="type-col">${row.c[3]?.f || row.c[3]?.v || '-'}</td>
          <td>${row.c[4]?.f || row.c[4]?.v || '-'}</td>
          <td>${row.c[5]?.f || row.c[5]?.v || '-'}</td>
          <td>${row.c[6]?.f || row.c[6]?.v || '-'}</td>
          <td>${row.c[7]?.f || row.c[7]?.v || '-'}</td>
        </tr>`;
      });
    });
</script>
</body>
</html>
