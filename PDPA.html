<script>
  const SHEET_ID = "1jyk7Yr7y0tFkTGc5vHrntkRxMZX6U-HmDptZPbjGD3o";
  // ใช้ out:json เพื่อดึงข้อมูลมาให้เราจัดการต่อเองได้แม่นยำที่สุด
  const url = `https://docs.google.com/spreadsheets/d/${SHEET_ID}/gviz/tq?tqx=out:json&gid=368374820`;

  fetch(url)
    .then(res => res.text())
    .then(text => {
      // ตัดส่วนที่เป็น JSON ของ Google ออก
      const json = JSON.parse(text.substring(47).slice(0, -2));
      const tbody = document.querySelector('#myTable tbody');
      tbody.innerHTML = "";
      
      json.table.rows.forEach((row, index) => {
        // ดึงค่ามาโดยเช็คทั้งช่องที่แสดงผล (.f) และค่าดิบ (.v)
        // ตำแหน่ง: B=0, E=4, F=1, G=2, H=3 (อิงตามโครงสร้างเดิมของน้า)
        const name = row.c[0]?.v || '-';
        const dateOut = row.c[4]?.f || row.c[4]?.v || '-';
        const dateExpire = row.c[1]?.f || row.c[1]?.v || '-';
        const remain = row.c[2]?.f || row.c[2]?.v || '-';
        const status = row.c[3]?.v || '-';

        // ป้องกันบรรทัดว่างที่ไม่มีชื่อ
        if(name === '-') return;

        tbody.innerHTML += `<tr>
          <td>${index + 1}</td>
          <td class="name-col">${name}</td>
          <td>${dateOut}</td>
          <td>${dateExpire}</td>
          <td>${remain}</td>
          <td>${status}</td>
        </tr>`;
      });
    })
    .catch(() => {
      document.querySelector('#myTable tbody').innerHTML = "<tr><td colspan='6'>โหลดข้อมูลไม่ได้</td></tr>";
    });
</script>
