<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <title>บันทึกเหตุการณ์ ประจำวัน</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Sarabun:wght@300;400;700&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Sarabun', sans-serif; }
        @media print {
            .no-print { display: none !important; }
            .hidden { display: block !important; }
            .shift-row { border: 1px solid #ddd !important; margin-bottom: 10px !important; }
            .max-w-4xl { max-width: 100% !important; border: none !important; box-shadow: none !important; }
            body { background: white !important; }
        }
    </style>
    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
        import { getDatabase, ref, set, get } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-database.js";

        const firebaseConfig = { databaseURL: "https://ubon-day-default-rtdb.asia-southeast1.firebasedatabase.app/" };
        const app = initializeApp(firebaseConfig);
        const db = getDatabase(app);

        window.loadData = async () => {
            const d = document.getElementById('day').value;
            const m = document.getElementById('month').value;
            const y = document.getElementById('year').value;
            if(!d || m === "" || !y) return;

            const snapshot = await get(ref(db, `logs/log-${d}-${m}-${y}`));
            document.querySelectorAll('.shift-row input, .shift-row select').forEach(el => el.value = "");

            if (snapshot.exists()) {
                const data = snapshot.val();
                document.querySelectorAll('.shift-row').forEach((row, i) => {
                    if (data[i]) {
                        row.querySelector('.doc-select').value = data[i].doc || "";
                        row.querySelector('.sup-select').value = data[i].sup || "";
                        row.querySelector('.co-input').value = data[i].co || "";
                        row.querySelector('.radio-select').value = data[i].radio || "";
                        row.querySelectorAll('.mc-input').forEach((input, j) => input.value = (data[i].mc && data[i].mc[j]) ? data[i].mc[j] : "");
                        row.querySelector('.s-total').value = data[i].stats?.total || "";
                        row.querySelector('.s-counsel').value = data[i].stats?.counsel || "";
                        row.querySelector('.s-traffic').value = data[i].stats?.traffic || "";
                        row.querySelector('.s-dc').value = data[i].stats?.dc || "";
                        row.querySelector('.s-home').value = data[i].stats?.home || "";
                        row.querySelector('.s-death').value = data[i].stats?.death || "";
                        row.querySelector('.s-als').value = data[i].stats?.als || "";
                        row.querySelector('.s-prank').value = data[i].stats?.prank || "";
                        row.querySelector('.s-other').value = data[i].stats?.other || "";
                    }
                });
            }
        };

        window.saveData = async () => {
            const dayVal = document.getElementById('day').value;
            const monthVal = document.getElementById('month').value;
            const yearVal = document.getElementById('year').value;
            if (!dayVal || monthVal === "" || !yearVal) { alert("กรุณาเลือก วัน เดือน พ.ศ. ให้ครบถ้วนครับ!"); return; }

            const allData = Array.from(document.querySelectorAll('.shift-row')).map(row => ({
                doc: row.querySelector('.doc-select').value,
                sup: row.querySelector('.sup-select').value,
                co: row.querySelector('.co-input').value,
                radio: row.querySelector('.radio-select').value,
                mc: Array.from(row.querySelectorAll('.mc-input')).map(input => input.value),
                stats: {
                    total: row.querySelector('.s-total').value,
                    counsel: row.querySelector('.s-counsel').value,
                    traffic: row.querySelector('.s-traffic').value,
                    dc: row.querySelector('.s-dc').value,
                    home: row.querySelector('.s-home').value,
                    death: row.querySelector('.s-death').value,
                    als: row.querySelector('.s-als').value,
                    prank: row.querySelector('.s-prank').value,
                    other: row.querySelector('.s-other').value
                }
            }));
            await set(ref(db, `logs/log-${dayVal}-${monthVal}-${yearVal}`), allData);
            alert("บันทึกข้อมูลวันที่ " + dayVal + "/" + (parseInt(monthVal)+1) + "/" + yearVal + " เรียบร้อยแล้วครับ");
        };

        window.changeDate = (delta) => {
            let d = parseInt(document.getElementById('day').value);
            let m = parseInt(document.getElementById('month').value);
            let y = parseInt(document.getElementById('year').value) - 543;
            let date = new Date(y, m, d);
            date.setDate(date.getDate() + delta);
            document.getElementById('day').value = date.getDate();
            document.getElementById('month').value = date.getMonth();
            document.getElementById('year').value = date.getFullYear() + 543;
            window.loadData();
        };
    </script>
</head>
<body class="bg-gray-100 p-4">
    <div class="max-w-4xl mx-auto bg-white p-8 rounded shadow-lg border-t-8 border-blue-800">
        <h1 class="text-2xl font-bold text-center mb-2">บันทึกเหตุการณ์ ประจำวัน</h1>
        <p class="text-center mb-6 text-gray-600 no-print">ศูนย์รับแจ้งเหตุและสั่งการจังหวัดอุบลราชธานี อบจ.อุบลราชธานี</p>
        
        <div class="mb-6 p-4 bg-gray-50 rounded flex flex-wrap gap-2 items-center justify-center border no-print">
            <button type="button" onclick="changeDate(-1)" class="bg-gray-500 text-white px-3 py-2 rounded font-bold"><<</button>
            <select id="day" class="border p-2 rounded"><option value="">-- วัน --</option></select>
            <select id="month" class="border p-2 rounded"><option value="">-- เดือน --</option></select>
            <select id="year" class="border p-2 rounded"><option value="">-- พ.ศ. --</option></select>
            <button type="button" onclick="changeDate(1)" class="bg-gray-500 text-white px-3 py-2 rounded font-bold">>></button>
            <button type="button" onclick="loadData()" class="bg-blue-600 text-white px-4 py-2 rounded hover:bg-blue-700">เรียกข้อมูล</button>
        </div>

        <div id="shiftsContainer" class="space-y-4"></div>
        
        <div class="text-center pt-8 no-print">
            <button type="button" onclick="saveData()" class="w-full md:w-64 px-6 py-3 bg-emerald-700 text-white rounded-md font-bold hover:bg-emerald-800 transition">บันทึกข้อมูล</button>
            <button type="button" onclick="window.location.href='https://apicharddummai.github.io/main/'" class="w-full md:w-64 px-6 py-3 bg-red-600 text-white rounded-md font-bold hover:bg-red-700 transition mt-2">ย้อนกลับ</button>
        </div>
    </div>

    <datalist id="staffData"></datalist>

    <script>
        const staffList = ["นายวิระบูรณ์ แก่นภักดี", "นางสาวนริศรา มะลิหอม", "นางสาวเบญจมาศ ชามาตย์", "นางสาวรัตติยา พันชัย", "นายนิกร วงศ์กำแหง", "นางสาวกุณฑิกา ส่งเสริม", "นายกฤษกร นางาม", "นางสาวเกตน์นิภา การะวัตร์", "นายชุติณัฐ มหิษานนท์", "นางสาวเสาวลักษณ์ ชารีโสม", "นางสาวนุชจรินทร์ รักษารอด", "นางสาวหทัยชนก มะตัน", "นางสาวสิริกานต์ สีแดง", "นางสาววิรากานต์ วงค์อินทร์", "นางสาวสุพัฒตา อุทุมพันธ์", "นางสาววรรณนิภา ดวงคำ", "นางสาวอาจานี มาสพันธ์", "นางสาวกาญจนา ราษี", "นางมลฤดี จันทะพา", "นางสาวพรพิมล จันทา", "นางสาวฉัตรฐริกา คุณมี", "นางสาวณัฐพัชร์ สมใสวิวิตรกุล", "นางสาวกัญญาณัฐ สมบูรณ์", "นางสาวรัตน์สุดา แสงสุข", "นางสาวญานิพร วงศ์เจริญ", "นางสาวภรณ์ทิพย์ ทิพประมวล", "นายเมธานันท์ เจริญชัย", "นายณัฐพงศ์ มีศรี", "นางสาวมาฆสิริ หอธรรม", "นายบริพัตร กุประดิษฐ์", "นายธนรัช เดชกังวาล", "นายอภิชาติ ดุมใหม่", "นางเพ็ญศรี สุวรรณกูฎ", "นางธนัชพร สมาทอง", "นางสาวพัชรี บุญชิต", "นางสาวว​ราภรณ์​ ปัจฉาพร", "นางอินทิรา นิธิวัฒนพงษ์", "นายอุดม พงษ์พิละ", "นางสาวทิพยวัลย์ สุทธาคง", "นางสาวเบ็ญจวรรณ พรมบุตร", "นายคม พันเพียง", "นางรัศมี สืบบุตร", "นางสาววรุณรัตน์ ชนะศรีรัตนกุล", "นางสาวจุติมา สมบูรณ์", "นางสาวฤทัยทิพย์ ดวงศรี", "นายธีระศักดิ์ การแก้ว", "นางสาวจันทร์จิรา จันทร์สว่าง", "นางสาวพัชรี พลกันยา", "นางสาวเบญจวรรณ อ่อนอรรถ", "นายแพทย์ชัยพร บุญศรี", "แพทย์หญิงวรรษพร อมรไชย"];
        const radioStaff = ["นายณัฐพงศ์ มีศรี", "นางสาวมาฆสิริ หอธรรม", "นายบริพัตร กุประดิษฐ์", "นายธนรัช เดชกังวาล"];
        const superVisors = ["นางเพ็ญศรี สุวรรณกูฎ", "นางธนัชพร สมาทอง", "นางสาวเบญจวรรณ อ่อนอรรถทอง", "นางสาวจันทร์จิรา จันทร์สว่าง", "นางสาวพัชรี พลกันยา"];
        const doctors = ["นายแพทย์ชัยพร บุญศรี", "แพทย์หญิงวรรษพร อมรไชย"];

        staffList.forEach(s => { let o = document.createElement('option'); o.value = s; document.getElementById('staffData').appendChild(o); });
        for(let i=1; i<=31; i++) document.getElementById('day').innerHTML += `<option value="${i}">${i}</option>`;
        ["มกราคม", "กุมภาพันธ์", "มีนาคม", "เมษายน", "พฤษภาคม", "มิถุนายน", "กรกฎาคม", "สิงหาคม", "กันยายน", "ตุลาคม", "พฤศจิกายน", "ธันวาคม"].forEach((m,i) => document.getElementById('month').innerHTML += `<option value="${i}">${m}</option>`);
        const y = new Date().getFullYear() + 543;
        for(let i=y-1; i<=y+5; i++) document.getElementById('year').innerHTML += `<option value="${i}">${i}</option>`;
        
        const now = new Date();
        document.getElementById('day').value = now.getDate();
        document.getElementById('month').value = now.getMonth();
        document.getElementById('year').value = now.getFullYear() + 543;

        const container = document.getElementById('shiftsContainer');
        ["ดึก ( 00.01 – 08.00 น. )", "เช้า ( 08.01 – 16.00 น. )", "บ่าย ( 16.01 – 24.00 น. )"].forEach(shift => {
            const div = document.createElement('div');
            div.className = "border-2 border-blue-200 rounded-xl bg-white shift-row";
            div.innerHTML = `
                <div class="bg-blue-50 p-4 cursor-pointer flex justify-between items-center" onclick="this.nextElementSibling.classList.toggle('hidden')">
                    <h2 class="font-bold text-lg text-blue-900">ประจำเวร${shift}</h2>
                    <span class="text-sm font-bold text-blue-600 no-print">คลิกเพื่อดูสถิติและสรุป</span>
                </div>
                <div class="p-6 space-y-6 hidden">
                    <div class="grid grid-cols-2 gap-4">
                        <select class="doc-select border p-2 rounded"><option value="">-- เลือกแพทย์ --</option>${doctors.map(d=>`<option value="${d}">${d}</option>`).join('')}</select>
                        <select class="sup-select border p-2 rounded"><option value="">-- เลือก Supervisor --</option>${superVisors.map(s=>`<option value="${s}">${s}</option>`).join('')}</select>
                        <input type="text" class="co-input border p-2 rounded" placeholder="Co">
                        <select class="radio-select border p-2 rounded"><option value="">-- เลือกพนักงานวิทยุ --</option>${radioStaff.map(s => `<option value="${s}">${s}</option>`).join('')}</select>
                    </div>
                    <div class="grid grid-cols-1 md:grid-cols-3 gap-3">
                        ${[...Array(9)].map((_, i) => `<input list="staffData" class="mc-input border p-2 rounded w-full" placeholder="${i+1}. ค้นหาชื่อ...">`).join('')}
                    </div>
                    <div class="border-t pt-4 bg-gray-50 p-4 rounded">
                        <div class="grid grid-cols-1 md:grid-cols-3 gap-4 text-sm">
                            <div><label class="block font-bold text-gray-700 mb-1">ยอดผู้ใช้บริการ (ราย)</label><input type="number" class="s-total border p-2 rounded w-full" placeholder="0"></div>
                            <div><label class="block font-bold text-gray-700 mb-1">ยอดให้คำปรึกษา (ราย)</label><input type="number" class="s-counsel border p-2 rounded w-full" placeholder="0"></div>
                            <div><label class="block font-bold text-gray-700 mb-1">ยอดอุบัติเหตุ (ราย)</label><input type="number" class="s-traffic border p-2 rounded w-full" placeholder="0"></div>
                            <div><label class="block font-bold text-gray-700 mb-1">ยอด D/C by phone (ราย)</label><input type="number" class="s-dc border p-2 rounded w-full" placeholder="0"></div>
                            <div><label class="block font-bold text-gray-700 mb-1">ยอดพาคนรักกลับบ้าน (ราย)</label><input type="number" class="s-home border p-2 rounded w-full" placeholder="0"></div>
                            <div><label class="block font-bold text-gray-700 mb-1">ยอดผู้เสียชีวิต (ราย)</label><input type="number" class="s-death border p-2 rounded w-full" placeholder="0"></div>
                            <div><label class="block font-bold text-gray-700 mb-1">ALS (ราย)</label><input type="number" class="s-als border p-2 rounded w-full" placeholder="0"></div>
                            <div><label class="block font-bold text-gray-700 mb-1">สายกวน (ราย)</label><input type="number" class="s-prank border p-2 rounded w-full" placeholder="0"></div>
                            <div><label class="block font-bold text-gray-700 mb-1">อื่นๆ (ราย)</label><input type="number" class="s-other border p-2 rounded w-full" placeholder="0"></div>
                        </div>
                    </div>
                </div>`;
            container.appendChild(div);
        });
    </script>
    <script>
        document.addEventListener('contextmenu', event => event.preventDefault());
        document.onkeydown = function(e) {
            if (e.keyCode == 123) return false;
            if (e.ctrlKey && e.shiftKey && e.keyCode == 'I'.charCodeAt(0)) return false;
            if (e.ctrlKey && e.shiftKey && e.keyCode == 'J'.charCodeAt(0)) return false;
            if (e.ctrlKey && e.keyCode == 'U'.charCodeAt(0)) return false;
        }
    </script>
</body>
</html>
