        // แค่เปลี่ยนตัวเลขหน้าจอ (value) ไม่ต้องสั่งบันทึก

        if(emsInput) emsInput.value = hospital.stroke_ems || 0;
    });
});
	
	// ฟังก์ชันเช็กเวลาทุกๆ 1 นาที ถ้าถึง 08:00 น. ให้สั่งรีเซ็ตเฉพาะ Stroke
setInterval(() => {
    const now = new Date();
    // เช็กว่าเป็นเวลา 08:00 น. เป๊ะๆ หรือไม่
    if (now.getHours() === 8 && now.getMinutes() === 0) {
        resetStrokeData();
    }
}, 60000); // เช็กทุก 60 วินาที

function resetStrokeData() {
    // ดึงข้อมูลปัจจุบันจากฐานข้อมูล
    const dbRef = ref(database, 'hospitals_data');
    get(dbRef).then((snapshot) => {
        let updates = {};
        snapshot.forEach((childSnapshot) => {
            let id = childSnapshot.key;
            // สั่งอัปเดตเฉพาะค่า Stroke ให้เป็น 0 (เตียงยังอยู่เท่าเดิม)
            updates[id + '/stroke_walkin'] = 0;
            updates[id + '/stroke_ems'] = 0;
            updates[id + '/strokeUpdate'] = "รีเซ็ตแล้วเมื่อ " + new Date().toLocaleDateString();
        });
        // ส่งค่า 0 ขึ้นไปอัปเดตที่ Firebase
        update(ref(database, 'hospitals_data'), updates);
    });
}

        }

        if (targetHospital === "1669") {
            // ตั้งรหัสผ่านสำหรับแอดมิน 1669 ตรงนี้
            if (enteredPin === "AdminEMS@2026") {
                currentUserRole = "1669";

                loginSuccess();
            } else {

    function updateLocalData(id) {
        let h = hospitals.find(x => x.id === id);
        if(h) {
            h.reporter = document.getElementById(`rep-${id}`).value;
            h.phone = document.getElementById(`tel-${id}`).value;
            h.note = document.getElementById(`note-${id}`).value;
            
            let oldGreen = h.green, oldYellow = h.yellow, oldRed = h.red;
            let oldWalkin = h.stroke_walkin || 0, oldEms = h.stroke_ems || 0;

            h.green = Math.max(0, parseInt(document.getElementById(`green-${id}`).value) || 0);
            h.yellow = Math.max(0, parseInt(document.getElementById(`yellow-${id}`).value) || 0);
            h.red = Math.max(0, parseInt(document.getElementById(`red-${id}`).value) || 0);
            
            h.stroke_walkin = Math.max(0, parseInt(document.getElementById(`stroke_walkin-${id}`).value) || 0);
            h.stroke_ems = Math.max(0, parseInt(document.getElementById(`stroke_ems-${id}`).value) || 0);

            const d = new Date();
            const timeString = `${d.getDate()} ${months[d.getMonth()]} ${d.getFullYear()+543} ${d.getHours()}:${String(d.getMinutes()).padStart(2, '0')}:${String(d.getSeconds()).padStart(2, '0')} น.`;

            let isBedChanged = (h.green !== oldGreen || h.yellow !== oldYellow || h.red !== oldRed || h.lastUpdate === "-");
            let isStrokeChanged = (h.stroke_walkin !== oldWalkin || h.stroke_ems !== oldEms || !h.strokeUpdate || h.strokeUpdate === "-");

            if (isBedChanged) {
                h.lastUpdate = timeString;
                h.timestamp = d.getTime(); 
            }
            if (isStrokeChanged) {
                h.strokeUpdate = timeString;
                h.strokeTimestamp = d.getTime(); 
            }
            if (!isBedChanged && !isStrokeChanged) {
                h.timestamp = d.getTime();
            }
        }
    }

    window.stepChange = function(id, type, val) {
        let inputEl = document.getElementById(`${type}-${id}`);
        if(inputEl) {
            let currentVal = parseInt(inputEl.value) || 0;
            let newVal = Math.max(0, currentVal + val);
            inputEl.value = newVal;
            
            let badgeEl = document.getElementById(`badge-${type}-${id}`);
            if(badgeEl) {
                if(type.startsWith('stroke_')) {
                    badgeEl.textContent = newVal + " คน";
                } else {
                    if (newVal === 0) {
                        badgeEl.className = "status-badge full";
                        badgeEl.textContent = "เต็ม";
                    } else {
                        badgeEl.className = "status-badge available";
                        badgeEl.textContent = "ว่าง";
                    }
                }
            }
        }
    }

    function render(data) {
        const currentTime = new Date().getTime();
        const oneMinuteInMs = 1 * 60 * 1000;

        document.getElementById('app').innerHTML = data.map(h => {
            let bedStatusClass = 'status-stable';
            if (h.timestamp && h.timestamp > 0) {
                const isRecentBed = (currentTime - h.timestamp < oneMinuteInMs);
                bedStatusClass = isRecentBed ? 'status-flashing' : 'status-stable';
            }

            let strokeStatusClass = 'status-stable';
            if (h.strokeTimestamp && h.strokeTimestamp > 0) {
                const isRecentStroke = (currentTime - h.strokeTimestamp < oneMinuteInMs);
                strokeStatusClass = isRecentStroke ? 'status-flashing' : 'status-stable';
            } else if (h.timestamp && h.timestamp > 0 && (!h.strokeUpdate || h.strokeUpdate === "-")) {
                const isRecentStroke = (currentTime - h.timestamp < oneMinuteInMs);
                strokeStatusClass = isRecentStroke ? 'status-flashing' : 'status-stable';
            }

            return `
                <div class="card">
                    <div class="h-name" title="${h.name}">🏥 ${h.name}</div>
                    
                    <div class="update-box ${bedStatusClass}">
                        ⏰ อัปเดตเตียง: ${h.lastUpdate || '-'}
                    </div>
                    
                    <div class="row">
                        <span>🟢 ทั่วไป</span> 
                        <div style="display: flex; align-items: center;">
                            <span id="badge-green-${h.id}" class="status-badge ${h.green === 0 ? 'full' : 'available'}">${h.green === 0 ? 'เต็ม' : 'ว่าง'}</span>
                            <div class="bed-ctrl-group">
                                <button class="btn-action btn-minus" onclick="stepChange(${h.id}, 'green', -1)">−</button>
                                <input type="number" id="green-${h.id}" class="bed-input" min="0" value="${h.green}">
                                <button class="btn-action btn-plus-item" onclick="stepChange(${h.id}, 'green', 1)">+</button>
                            </div>
                        </div>
                    </div>
                    
                    <div class="row">
                        <span>🟡 ฉุกเฉิน</span> 
                        <div style="display: flex; align-items: center;">
                            <span id="badge-yellow-${h.id}" class="status-badge ${h.yellow === 0 ? 'full' : 'available'}">${h.yellow === 0 ? 'เต็ม' : 'ว่าง'}</span>
                            <div class="bed-ctrl-group">
                                <button class="btn-action btn-minus" onclick="stepChange(${h.id}, 'yellow', -1)">−</button>
                                <input type="number" id="yellow-${h.id}" class="bed-input" min="0" value="${h.yellow}">
                                <button class="btn-action btn-plus-item" onclick="stepChange(${h.id}, 'yellow', 1)">+</button>
                            </div>
                        </div>
                    </div>
                    
                    <div class="row">
                        <span>🔴 วิกฤต</span> 
                        <div style="display: flex; align-items: center;">
                            <span id="badge-red-${h.id}" class="status-badge ${h.red === 0 ? 'full' : 'available'}">${h.red === 0 ? 'เต็ม' : 'ว่าง'}</span>
                            <div class="bed-ctrl-group">
                                <button class="btn-action btn-minus" onclick="stepChange(${h.id}, 'red', -1)">−</button>
                                <input type="number" id="red-${h.id}" class="bed-input" min="0" value="${h.red}">
                                <button class="btn-action btn-plus-item" onclick="stepChange(${h.id}, 'red', 1)">+</button>
                            </div>
                        </div>
                    </div>

                    <hr>

                    <div class="update-box ${strokeStatusClass}">
                        ⏰ อัปเดต Stroke: ${h.strokeUpdate || '-'}
                    </div>

                    <div class="group-header">
                        <span>🧠 Stroke Fast Track</span>
                    </div>
                    
                    <div class="row">
                        <span style="padding-left:6px; color:#555;">1. Walk in</span>
                        <div style="display: flex; align-items: center;">
                            <span id="badge-stroke_walkin-${h.id}" class="status-badge count-badge">${h.stroke_walkin || 0} คน</span>
                            <div class="bed-ctrl-group">
                                <button class="btn-action btn-minus" onclick="stepChange(${h.id}, 'stroke_walkin', -1)">−</button>
                                <input type="number" id="stroke_walkin-${h.id}" class="bed-input" min="0" value="${h.stroke_walkin || 0}">
                                <button class="btn-action btn-plus-item" onclick="stepChange(${h.id}, 'stroke_walkin', 1)">+</button>
                            </div>
                        </div>
                    </div>

                    <div class="row">
                        <span style="padding-left:6px; color:#555;">2. EMS</span>
                        <div style="display: flex; align-items: center;">
                            <span id="badge-stroke_ems-${h.id}" class="status-badge count-badge">${h.stroke_ems || 0} คน</span>
                            <div class="bed-ctrl-group">
                                <button class="btn-action btn-minus" onclick="stepChange(${h.id}, 'stroke_ems', -1)">−</button>
                                <input type="number" id="stroke_ems-${h.id}" class="bed-input" min="0" value="${h.stroke_ems || 0}">
                                <button class="btn-action btn-plus-item" onclick="stepChange(${h.id}, 'stroke_ems', 1)">+</button>
                            </div>
                        </div>
                    </div>

                    <div class="input-group">
                        <input type="text" id="rep-${h.id}" placeholder="👤 ชื่อผู้รายงาน" value="${h.reporter || ''}">
                        <input type="tel" id="tel-${h.id}" placeholder="📞 เบอร์ติดต่อ" value="${h.phone || ''}">
                        <textarea id="note-${h.id}" placeholder="📝 หมายเหตุเพิ่มเติม...">${h.note || ""}</textarea>
                    </div>
                    <button class="save-btn" id="btn-${h.id}" onclick="save(${h.id})">บันทึกข้อมูล</button>
                </div>
            `;
        }).join('');
        
        data.forEach(h => {
            ['green', 'yellow', 'red', 'stroke_walkin', 'stroke_ems'].forEach(type => {
                let inputEl = document.getElementById(`${type}-${h.id}`);
                if(inputEl) {
                    inputEl.addEventListener('input', (e) => {
                        let val = Math.max(0, parseInt(e.target.value) || 0);
                        let badgeEl = document.getElementById(`badge-${type}-${h.id}`);
                        if(badgeEl) {
                            if(type.startsWith('stroke_')) {
                                badgeEl.textContent = val + " คน";
                            } else {
                                badgeEl.className = val === 0 ? "status-badge full" : "status-badge available";
                                badgeEl.textContent = val === 0 ? "เต็ม" : "ว่าง";
                            }
                        }
                    });
                }
            });
        });
    }

    window.save = function(id) {
        updateLocalData(id);
        
        set(dbRef, hospitals).then(() => {
            let btn = document.getElementById(`btn-${id}`);
            btn.classList.add('btn-pulse');
            setTimeout(() => btn.classList.remove('btn-pulse'), 500);
            
            Swal.fire({ title: 'บันทึกข้อมูลสำเร็จ', icon: 'success', timer: 1500, showConfirmButton: false });
            filterHospitals('save');
        }).catch((err) => {
            console.error("Firebase Save Error: ", err);
            Swal.fire({ title: 'บันทึกไม่สำเร็จ', text: 'โปรดตรวจสอบสิทธิ์อินเทอร์เน็ต', icon: 'error' });
        });
    }

    window.filterHospitals = function(source) {
        // หากไม่มีบทบาทผู้ใช้ ให้ระบบหยุดทำงาน
        if (!currentUserRole) return;

        let val = document.getElementById('searchInput').value.toLowerCase();
        document.getElementById('clearBtn').style.display = val ? 'block' : 'none';
        
        if (source === 'input' && val === '') {
            document.getElementById('hospitalDropdown').value = '';
        }

        // เก็บข้อมูลจากฟิลด์อินพุตปัจจุบันลงตัวแปรชั่วคราว
        let activeElements = document.querySelectorAll('.card');
        if (activeElements.length > 0 && source !== 'sync' && source !== 'login') {
            hospitals.forEach(h => {
                let greenEl = document.getElementById(`green-${h.id}`);
                let yellowEl = document.getElementById(`yellow-${h.id}`);
                let redEl = document.getElementById(`red-${h.id}`);
                let walkinEl = document.getElementById(`stroke_walkin-${h.id}`);
                let emsEl = document.getElementById(`stroke_ems-${h.id}`);
                let repEl = document.getElementById(`rep-${h.id}`);
                let telEl = document.getElementById(`tel-${h.id}`);
                let noteEl = document.getElementById(`note-${h.id}`);
                
                if (greenEl) h.green = Math.max(0, parseInt(greenEl.value) || 0);
                if (yellowEl) h.yellow = Math.max(0, parseInt(yellowEl.value) || 0);
                if (redEl) h.red = Math.max(0, parseInt(redEl.value) || 0);
                if (walkinEl) h.stroke_walkin = Math.max(0, parseInt(walkinEl.value) || 0);
                if (emsEl) h.stroke_ems = Math.max(0, parseInt(emsEl.value) || 0);
                if (repEl) h.reporter = repEl.value;
                if (telEl) h.phone = telEl.value;
                if (noteEl) h.note = noteEl.value;
            });
        }

        let filtered = [];

        if (currentUserRole === "1669") {
            // สิทธิ์แอดมิน 1669: เห็นทุก รพ. และกรองตามคำค้นหาได้
            document.getElementById('summaryBtn').style.display = 'inline-block';
            document.getElementById('hospitalDropdown').style.display = 'inline-block';
            document.getElementById('searchInput').style.display = 'inline-block';
            
            filtered = hospitals.filter(h => h.name.toLowerCase().includes(val));
            filtered.sort((a, b) => b.timestamp - a.timestamp);
        } else {
            // สิทธิ์โรงพยาบาลทั่วไป: ล็อกผลลัพธ์ให้เห็นเฉพาะชื่อ รพ. ตัวเอง 1 ใบเท่านั้น
            document.getElementById('summaryBtn').style.display = 'none'; // ซ่อนสรุปรายงานไม่ให้ รพ. อื่นเห็น
            document.getElementById('hospitalDropdown').style.display = 'none'; // ซ่อนตัวกรอง
            document.getElementById('searchInput').style.display = 'none'; // ซ่อนกล่องค้นหา
            
            filtered = hospitals.filter(h => h.name === currentUserRole);
        }

        render(filtered);
    }

    window.clearSearch = function() {
        document.getElementById('searchInput').value = '';
        document.getElementById('hospitalDropdown').value = '';
        filterHospitals('clear');
    }

    setInterval(() => {
        if(currentUserRole) filterHospitals('interval');
    }, 10000);

    setInterval(() => {
        const d = new Date();
        document.getElementById('liveClock').innerHTML = `วันที่ ${d.getDate()} ${months[d.getMonth()]} ${d.getFullYear()+543}<br>${d.toLocaleTimeString('th-TH')}`;
    }, 1000);

    document.addEventListener('contextmenu', e => e.preventDefault());
    document.addEventListener('keydown', e => {
        if (e.keyCode == 123 || (e.ctrlKey && (e.keyCode == 73 || e.keyCode == 85 || e.keyCode == 83))) e.preventDefault();
    });
</script>
