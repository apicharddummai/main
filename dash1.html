<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>1669 EMS Dashboard - TV Fix</title>
    <style>
        body, html {
            margin: 0; padding: 0; height: 100%; width: 100%;
            background-color: #000;
            overflow: auto; 
            -webkit-overflow-scrolling: touch;
        }
        #screen-toggle-btn {
            position: fixed; bottom: 15px; right: 15px; z-index: 9999;
            width: 42px; height: 42px; background: rgba(255, 255, 255, 0.4);
            border: 2px solid #fff; border-radius: 50%;
            cursor: pointer; display: flex; align-items: center; justify-content: center;
        }
        #screen-toggle-btn svg { fill: white; width: 22px; height: 22px; }
        
        /* ปรับ iFrame ให้รองรับ TV รุ่นเก่า */
        iframe {
            border: none;
            width: 100%;
            height: 250vh; /* ความสูงเพื่อให้เลื่อนได้ */
            display: block;
            transform-origin: 0 0;
        }
    </style>
</head>
<body>

    <div id="screen-toggle-btn" onclick="toggleScreen();">
        <svg viewBox="0 0 24 24"><path d="M7 14H5v5h5v-2H7v-3zm-2-4h2V7h3V5H5v5zm12 7h-3v2h5v-5h-2v3zM14 5v2h3v3h2V5h-5z"/></svg>
    </div>

    <iframe id="looker-frame" 
            src="https://datastudio.google.com/reporting/312c8a8c-df16-4076-b3a1-5c1a9e99a1f7" 
            allowfullscreen>
    </iframe>

    <script>
        const frame = document.getElementById('looker-frame');

        function toggleScreen() {
            if (!document.fullscreenElement && !document.webkitFullscreenElement) {
                const elem = document.documentElement;
                if (elem.requestFullscreen) { elem.requestFullscreen(); }
                else if (elem.webkitRequestFullscreen) { elem.webkitRequestFullscreen(); }
            } else {
                if (document.exitFullscreen) { document.exitFullscreen(); }
                else if (document.webkitExitFullscreen) { document.webkitExitFullscreen(); }
            }
        }

        
        setInterval(function() {
            const currentSrc = frame.src;
            frame.src = 'about:blank';
            setTimeout(() => {
                frame.src = currentSrc;
            }, 1000);
        }, 900000);

        document.addEventListener('contextmenu', e => e.preventDefault());
    </script>
</body>
</html>
